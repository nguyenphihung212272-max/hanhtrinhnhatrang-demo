  /* retro scanline texture */
  .scanlines{
    position:absolute; inset:0;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,.12) 0px, rgba(0,0,0,.12) 1px, transparent 2px, transparent 4px);
    mix-blend-mode:multiply;
    opacity:.3;
    pointer-events:none;
  }

  /* water shimmer near the sunset reflection */
  .shimmer{
    position:absolute; right:0; top:34%; width:42%; height:24%;
    background:linear-gradient(115deg, transparent 0%, rgba(255,235,190,.22) 45%, transparent 60%);
    background-size:250% 100%;
    animation:shimmerMove 6s ease-in-out infinite;
    pointer-events:none;
    mix-blend-mode:screen;
  }
  @keyframes shimmerMove{
    0%{ background-position:120% 0; }
    50%{ background-position:-20% 0; }
    100%{ background-position:120% 0; }
  }

  /* drifting pixel clouds */
  .pixel-cloud{
    position:absolute;
    width:8px; height:8px;
    box-shadow:
      8px 0 0 var(--cream), 16px 0 0 var(--cream),
      0 8px 0 var(--cream), 8px 8px 0 var(--cream), 16px 8px 0 var(--cream), 24px 8px 0 var(--cream),
      -8px 16px 0 var(--cream), 0 16px 0 var(--cream), 8px 16px 0 var(--cream), 16px 16px 0 var(--cream), 24px 16px 0 var(--cream), 32px 16px 0 var(--cream);
    pointer-events:none;
  }
  .pc-a{ top:6%; opacity:.5; transform:scale(3); animation:driftLeft 58s linear infinite; }
  .pc-b{ top:14%; opacity:.35; transform:scale(2); animation:driftLeft 78s linear infinite; animation-delay:-30s; }
  @keyframes driftLeft{ from{ left:-10%; } to{ left:110%; } }

  /* title */
  .title-scrim{
    position:absolute; top:0; left:0; right:0; height:26%;
    background:linear-gradient(to bottom, rgba(8,12,26,.78), rgba(8,12,26,0));
    pointer-events:none;
  }
  .title-block{ position:absolute; top:3%; left:0; right:0; text-align:center; padding:0 4%; }
  .game-title{
    font-family:'Silkscreen', monospace;
    font-weight:700;
    font-size:clamp(20px, 4.4vw, 44px);
    letter-spacing:2px;
    color:var(--gold-soft);
    text-shadow:3px 3px 0 #5c2f1a, 6px 6px 0 rgba(0,0,0,.5);
    margin:0 0 .4em;
    animation:floaty 4.5s ease-in-out infinite;
  }
  .game-subtitle{
    font-family:'VT323', monospace;
    font-size:clamp(13px, 2vw, 20px);
    color:var(--cream);
    letter-spacing:1px;
    text-shadow:2px 2px 0 rgba(0,0,0,.6);
    margin:0;
  }
  @keyframes floaty{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }

  /* journey path */
  .journey-path{ position:absolute; inset:0; display:block; pointer-events:none; }

  /* pins */
  .pin{
    position:absolute;
    transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center;
    background:none; border:none; cursor:pointer; padding:0;
  }
  .pin-icon{
    position:relative;
    width:clamp(38px, 6.2vw, 64px); height:clamp(38px, 6.2vw, 64px);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(18px, 3vw, 30px);
    border:3px solid var(--gold-soft);
    background:radial-gradient(circle at 35% 30%, #3c2414, #1a0f08 75%);
    box-shadow:0 0 0 3px rgba(0,0,0,.45);
    transition:transform .15s ease;
  }
  .pin:hover .pin-icon, .pin:focus-visible .pin-icon{ transform:scale(1.08); }
  .pin:active .pin-icon{ transform:scale(.94); }
  .pin--unlocked .pin-icon{ animation:glowPulse 2.2s ease-in-out infinite; }
  @keyframes glowPulse{
    0%,100%{ box-shadow:0 0 0 3px rgba(0,0,0,.45), 0 0 0 0 rgba(244,185,66,0); }
    50%{ box-shadow:0 0 0 3px rgba(0,0,0,.45), 0 0 22px 8px rgba(244,185,66,.65); }
  }
  .pin--locked .pin-icon{ border-color:var(--stone); filter:grayscale(.7) brightness(.75); }
  .pin--locked .pin-icon::after{
    content:'🔒';
    position:absolute; bottom:-6px; right:-6px;
    font-size:.5em;
    background:var(--navy-deep);
    border-radius:50%;
    width:1.7em; height:1.7em;
    display:flex; align-items:center; justify-content:center;
    border:2px solid var(--stone);
  }
  .pin-order{
    position:absolute; top:-6px; left:-6px;
    background:var(--navy-deep); color:var(--gold-soft);
    font-family:'VT323'; font-size:clamp(10px,1.4vw,14px);
    width:1.5em; height:1.5em; border-radius:50%;
    border:2px solid var(--gold-soft);
    display:flex; align-items:center; justify-content:center;
  }
  .pin--locked .pin-order{ border-color:var(--stone); color:var(--stone); }
  .pin-label{
    margin-top:6px; font-family:'VT323'; font-size:clamp(11px, 1.6vw, 16px);
    color:var(--cream); text-shadow:2px 2px 0 rgba(0,0,0,.7); white-space:nowrap;
  }

  .sparkle{
    position:absolute; width:5px; height:5px; background:var(--gold-soft);
    pointer-events:none; animation:sparkleFloat 2.4s ease-in-out forwards;
  }
  @keyframes sparkleFloat{
    0%{ opacity:0; transform:translateY(0) scale(.6); }
    40%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-26px) scale(1); }
  }

  .tooltip{
    position:absolute; max-width:210px;
    background:rgba(10,16,30,.94); border:2px solid var(--gold-soft);
    padding:8px 10px; font-family:'VT323'; font-size:clamp(12px,1.7vw,16px);
    color:var(--cream); transform:translate(-50%, calc(-100% - 14px));
    opacity:0; pointer-events:none; transition:opacity .15s ease; z-index:20;
  }
  .tooltip.show{ opacity:1; }
  .tooltip b{ color:var(--gold-soft); display:block; margin-bottom:2px; font-family:'Silkscreen'; font-size:.85em; }
  .tooltip::after{
    content:''; position:absolute; bottom:-8px; left:50%; transform:translateX(-50%);
    border:6px solid transparent; border-top-color:var(--gold-soft);
  }

  /* HUD */
  .hud-scrim{
    position:absolute; left:0; right:0; bottom:0; height:20%;
    background:linear-gradient(to top, rgba(8,12,26,.82), rgba(8,12,26,0));
    pointer-events:none;
  }
  .hud-bar{
    position:absolute; left:0; right:0; bottom:3%;
    display:flex; align-items:center; justify-content:center;
    gap:clamp(10px,2vw,22px);
  }
  .hud-btn{
    background:rgba(16,24,45,.85); border:2px solid var(--gold-soft); color:var(--cream);
    width:clamp(38px,5.4vw,52px); height:clamp(38px,5.4vw,52px);
    border-radius:10px; font-size:clamp(16px,2.4vw,22px); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease, background .2s ease;
  }
  .hud-btn:hover, .hud-btn:focus-visible{ transform:translateY(-3px); background:rgba(30,42,70,.9); }
  .hud-btn:active{ transform:translateY(0); }

  .start-btn{
    font-family:'Silkscreen'; font-weight:700;
    background:linear-gradient(180deg,#ffe08a,var(--gold));
    border:3px solid #7a4a14; color:#3a1f08;
    padding:clamp(10px,1.6vw,16px) clamp(18px,3.2vw,32px);
    font-size:clamp(13px,2vw,19px); letter-spacing:1px; cursor:pointer;
    box-shadow:0 4px 0 #7a4a14, 0 4px 18px rgba(244,185,66,.5);
    animation:ctaPulse 2.6s ease-in-out infinite;
    transition:transform .12s ease;
  }
  .start-btn:hover, .start-btn:focus-visible{ transform:translateY(-2px); }
  .start-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #7a4a14; }
  @keyframes ctaPulse{
    0%,100%{ box-shadow:0 4px 0 #7a4a14, 0 4px 18px rgba(244,185,66,.5); }
    50%{ box-shadow:0 4px 0 #7a4a14, 0 4px 28px rgba(244,185,66,.85); }
  }

  .modal-backdrop{
    position:absolute; inset:0; background:rgba(6,10,20,.72);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .18s ease; z-index:30;
  }
  .modal-backdrop.show{ opacity:1; pointer-events:auto; }
  .modal{
    background:linear-gradient(180deg,#16233f,#0c1526);
    border:3px solid var(--gold-soft);
    padding:clamp(16px,3vw,28px);
    width:min(86%, 420px); text-align:center;
    font-family:'VT323'; color:var(--cream);
  }
  .modal h3{
    font-family:'Silkscreen'; color:var(--gold-soft);
    font-size:clamp(15px,2.4vw,20px); margin:0 0 14px; letter-spacing:1px;
  }
  .museum-slots{ display:flex; justify-content:center; gap:14px; margin:16px 0; }
  .slot{
    width:56px; height:56px; border-radius:8px; border:2px dashed var(--stone);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; color:var(--stone); filter:grayscale(1);
  }
  .modal p{ font-size:clamp(13px,2vw,16px); line-height:1.4; margin:0 0 16px; }
  .modal-close{
    font-family:'Silkscreen'; background:var(--gold); border:2px solid #7a4a14;
    color:#3a1f08; padding:8px 18px; cursor:pointer; font-size:13px;
  }

  .toast{
    position:fixed; left:50%; bottom:8vh; transform:translate(-50%, 10px);
    background:rgba(10,16,30,.94); border:2px solid var(--gold-soft);
    color:var(--cream); font-family:'VT323'; font-size:clamp(13px,2vw,17px);
    padding:8px 16px; opacity:0; transition:opacity .25s ease, transform .25s ease;
    pointer-events:none; z-index:60; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  /* ===== character selection room ===== */
  .char-room{
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 32%, #24365a 0%, #101a30 55%, #0a1120 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(14px,3vh,30px);
    padding:6% 4% 0;
    overflow:hidden;
  }
  .char-floor{
    position:absolute; left:0; right:0; bottom:0; height:16%;
    background:repeating-linear-gradient(90deg, #1a2440 0 26px, #202f52 26px 52px);
    border-top:3px solid rgba(244,185,66,.4);
  }
  .char-wall-glow{
    position:absolute; top:-10%; left:50%; transform:translateX(-50%);
    width:60%; height:60%;
    background:radial-gradient(circle, rgba(244,185,66,.16), transparent 70%);
    pointer-events:none;
  }
  .torch{
    position:absolute; top:28%; font-size:clamp(20px,3.2vw,32px);
    animation:torchFlicker 1.6s ease-in-out infinite;
    filter:drop-shadow(0 0 10px rgba(244,185,66,.7));
    pointer-events:none;
  }
  .torch--left{ left:6%; } .torch--right{ right:6%; animation-delay:-.8s; }
  @keyframes torchFlicker{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.08); opacity:.85; }
  }
  .back-btn{
    position:absolute; top:4%; left:4%;
    background:rgba(16,24,45,.85); border:2px solid var(--gold-soft); color:var(--cream);
    font-family:'VT323'; font-size:clamp(13px,1.8vw,17px);
    padding:8px 14px; border-radius:8px; cursor:pointer;
    display:flex; align-items:center; gap:6px;
    transition:transform .12s ease;
  }
  .back-btn:hover, .back-btn:focus-visible{ transform:translateX(-3px); }
  .char-title{
    font-family:'Silkscreen', monospace; font-weight:700;
    font-size:clamp(20px,4vw,38px); letter-spacing:2px;
    color:var(--gold-soft);
    text-shadow:3px 3px 0 #5c2f1a, 6px 6px 0 rgba(0,0,0,.5);
    margin:0; text-align:center; z-index:2;
  }
  .char-row{
    display:flex; gap:clamp(18px,4vw,56px); align-items:flex-end; z-index:2;
    flex-wrap:wrap; justify-content:center;
  }
  .char-card{
    background:rgba(16,24,45,.55); border:3px solid rgba(138,148,165,.4); border-radius:14px;
    padding:clamp(14px,2vw,22px) clamp(12px,1.8vw,18px);
    display:flex; flex-direction:column; align-items:center; gap:8px;
    cursor:pointer; position:relative;
    width:clamp(130px,20vw,190px);
    transition:transform .18s ease, border-color .2s ease, background .2s ease, opacity .2s ease, filter .2s ease;
  }
  .char-card:hover, .char-card:focus-visible{ transform:translateY(-6px); }
  .char-card.selected{
    border-color:var(--gold-soft);
    background:rgba(30,42,70,.8);
    box-shadow:0 0 28px rgba(244,185,66,.55);
  }
  .char-row.has-selection .char-card:not(.selected){ opacity:.5; filter:grayscale(.5); }
  .char-pedestal{
    width:70%; height:10px; border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(244,185,66,.5), transparent 70%);
    margin-top:-4px;
  }
  .char-sprite{ width:clamp(64px,10vw,104px); height:auto; }
  .char-name{
    font-family:'Silkscreen'; color:var(--gold-soft); font-size:clamp(14px,2vw,19px); letter-spacing:1px;
  }
  .char-role{ font-family:'VT323'; color:var(--cream); font-size:clamp(12px,1.6vw,15px); }
  .char-check{
    position:absolute; top:-10px; right:-10px;
    width:26px; height:26px; border-radius:50%;
    background:var(--gold); color:#3a1f08; border:2px solid #7a4a14;
    display:none; align-items:center; justify-content:center;
    font-size:14px; font-weight:bold;
  }
  .char-card.selected .char-check{ display:flex; }
  .confirm-btn{
    font-family:'Silkscreen'; font-weight:700;
    background:linear-gradient(180deg,#ffe08a,var(--gold));
    border:3px solid #7a4a14; color:#3a1f08;
    padding:clamp(10px,1.6vw,16px) clamp(18px,3vw,30px);
    font-size:clamp(12px,1.8vw,17px); letter-spacing:1px; cursor:pointer;
    box-shadow:0 4px 0 #7a4a14;
    z-index:2; margin-top:4px;
    transition:opacity .2s ease, transform .12s ease, box-shadow .2s ease;
  }
  .confirm-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .confirm-btn:not(:disabled){ animation:ctaPulse 2.6s ease-in-out infinite; }
  .confirm-btn:not(:disabled):hover{ transform:translateY(-2px); }
  .confirm-btn:not(:disabled):active{ transform:translateY(2px); box-shadow:0 2px 0 #7a4a14; }

  /* ===== level play screen ===== */
  .level-stage{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center;
    overflow:hidden; overflow-y:auto;
    background:var(--level-bg, linear-gradient(180deg,#2a3f66,#101a30));
  }
  .level--thapba{ --level-bg:linear-gradient(180deg,#5a7ca8 0%, #e2a95c 55%, #8a5a3a 100%); --level-accent:#f4b942; }
  .level--nhathoda{ --level-bg:linear-gradient(180deg,#1c2a4d 0%, #3a4f7a 55%, #6a5a86 100%); --level-accent:#9fc7ff; }
  .level--honchong{ --level-bg:linear-gradient(180deg,#274064 0%, #d97a4a 55%, #7a3b52 100%); --level-accent:#ffd77a; }

  .level-back-btn{
    position:absolute; top:3%; left:4%; z-index:5;
    background:rgba(10,16,30,.7); border:2px solid var(--gold-soft); color:var(--cream);
    font-family:'VT323'; font-size:clamp(12px,1.6vw,16px);
    padding:6px 12px; border-radius:8px; cursor:pointer;
  }

  .level-header{
    position:relative; z-index:2; width:100%; max-width:640px;
    display:flex; align-items:center; justify-content:space-between;
    padding:3% 6% 0; font-family:'VT323'; box-sizing:border-box;
  }
  .level-name{
    font-family:'Silkscreen'; color:var(--cream); font-size:clamp(14px,2.2vw,20px);
    text-shadow:2px 2px 0 rgba(0,0,0,.5); display:flex; align-items:center; gap:6px;
  }
  .level-hud{ display:flex; align-items:center; gap:10px; }
  .hearts{ font-size:clamp(14px,2vw,18px); }
  .hint-btn{
    background:rgba(16,24,45,.85); border:2px solid var(--gold-soft); color:var(--cream);
    font-family:'VT323'; font-size:clamp(12px,1.6vw,15px);
    padding:5px 10px; border-radius:8px; cursor:pointer;
  }
  .hint-btn:disabled{ opacity:.4; cursor:not-allowed; }

  .level-path{
    position:relative; z-index:2;
    display:flex; align-items:center; justify-content:center; gap:clamp(10px,3vw,26px);
    margin-top:clamp(10px,3vh,20px); flex-wrap:wrap; padding:0 4%;
  }
  .path-node{
    width:clamp(16px,2.6vw,22px); height:clamp(16px,2.6vw,22px);
    border-radius:50%; background:rgba(10,16,30,.6); border:2px solid var(--stone);
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--stone);
    position:relative; transition:border-color .2s ease, background .2s ease;
  }
  .path-node.done{ border-color:var(--gold-soft); background:var(--gold); color:#3a1f08; }
  .path-node.current{ border-color:var(--gold-soft); box-shadow:0 0 12px rgba(244,185,66,.7); }
  .path-node .walker{
    position:absolute; top:-26px; left:50%; transform:translateX(-50%);
    font-size:18px; display:none;
  }
  .path-node.current .walker{ display:block; animation:bob 1.2s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translate(-50%,0); } 50%{ transform:translate(-50%,-4px); } }

  .zone-intro{
    position:relative; z-index:2;
    background:rgba(8,12,26,.72); border:2px solid var(--level-accent, var(--gold-soft));
    border-radius:14px; padding:clamp(16px,3vw,26px);
    max-width:min(90%,480px); margin-top:clamp(16px,4vh,36px);
    text-align:center; font-family:'VT323'; color:var(--cream);
  }
  .zone-intro h4{
    font-family:'Silkscreen'; color:var(--gold-soft); font-size:clamp(14px,2vw,18px);
    margin:0 0 10px; letter-spacing:1px;
  }
  .zone-intro p{ font-size:clamp(13px,1.9vw,16px); line-height:1.5; margin:0 0 16px; }

  .level-question-card{
    position:relative; z-index:2;
    background:rgba(8,12,26,.8); border:2px solid var(--level-accent, var(--gold-soft));
    border-radius:14px; padding:clamp(16px,3vw,26px);
    width:min(92%,560px); margin:clamp(12px,3vh,24px) 0 6%;
    font-family:'VT323'; color:var(--cream); box-sizing:border-box;
  }
  .q-progress{ font-size:clamp(11px,1.5vw,14px); color:var(--stone); margin:0 0 6px; letter-spacing:1px; }
  .q-prompt{
    font-family:'Silkscreen'; font-size:clamp(13px,2vw,18px); color:var(--cream);
    line-height:1.5; margin:0 0 14px;
  }
  .q-options{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:560px){ .q-options{ grid-template-columns:1fr; } }
  .q-option{
    background:rgba(20,30,54,.85); border:2px solid var(--stone); color:var(--cream);
    font-family:'VT323'; font-size:clamp(12px,1.8vw,15px);
    padding:10px 12px; border-radius:8px; text-align:left; cursor:pointer;
    transition:transform .12s ease, border-color .2s ease, background .2s ease, opacity .2s ease;
  }
  .q-option:hover:not(:disabled), .q-option:focus-visible:not(:disabled){ transform:translateY(-2px); border-color:var(--gold-soft); }
  .q-option:disabled{ cursor:not-allowed; }
  .q-option.correct{ border-color:#6fcf7a; background:rgba(70,140,80,.55); }
  .q-option.wrong{ border-color:#e2665a; background:rgba(140,60,55,.5); }
  .q-option.eliminated{ opacity:.35; }
  .q-feedback{ min-height:1.4em; margin:12px 0 0; font-size:clamp(12px,1.8vw,15px); color:var(--gold-soft); }
  .q-next-btn{
    margin-top:10px; font-family:'Silkscreen';
    background:linear-gradient(180deg,#ffe08a,var(--gold));
    border:3px solid #7a4a14; color:#3a1f08;
    padding:8px 18px; font-size:clamp(12px,1.8vw,15px); cursor:pointer;
    box-shadow:0 3px 0 #7a4a14; display:none;
  }
  .q-next-btn.show{ display:inline-block; }

  /* summary screen */
  .summary-stage{
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 30%, #24365a 0%, #0a1120 75%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:6%; text-align:center; box-sizing:border-box;
  }
  .summary-stage h2{
    font-family:'Silkscreen'; color:var(--gold-soft); font-size:clamp(20px,3.4vw,34px);
    text-shadow:3px 3px 0 #5c2f1a; margin:0;
  }
  .summary-stats{
    font-family:'VT323'; color:var(--cream); font-size:clamp(14px,2vw,18px);
    display:flex; flex-direction:column; gap:4px;
    background:rgba(16,24,45,.6); border:2px solid var(--gold-soft);
    padding:14px 22px; border-radius:12px; min-width:220px;
  }
  .summary-stats .row{ display:flex; justify-content:space-between; gap:20px; }
  .summary-stars{ font-size:clamp(22px,4vw,34px); letter-spacing:4px; }
  .summary-line{ font-family:'VT323'; color:var(--cream); font-size:clamp(13px,2vw,17px); max-width:420px; }
  .fragment-icon{ font-size:40px; margin-bottom:10px; }

  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; }
  }
  @media (max-width:640px){
    .pin-label{ display:none; }
  }
</style>
</head>
<body>
<div class="app">
<div class="screen screen--menu active" id="screenMenu">
<div class="wrapper">
  <div class="stage" id="stage">
    <div class="scanlines"></div>
    <div class="shimmer"></div>
    <div class="pixel-cloud pc-a"></div>
    <div class="pixel-cloud pc-b"></div>

    <div class="title-scrim"></div>
    <div class="title-block">
      <h1 class="game-title">NHA TRANG PIXEL QUEST</h1>
      <p class="game-subtitle">Hành Trình Giải Mã Di Sản</p>
    </div>

    <svg class="journey-path" viewBox="0 0 100 100" preserveAspectRatio="none">
      <line id="pathLine1" x1="22" y1="45" x2="52" y2="33" stroke="#f4b94288" stroke-width="0.5" stroke-dasharray="1.5 1.5"/>
      <line id="pathLine2" x1="52" y1="33" x2="80" y2="72" stroke="#8a94a566" stroke-width="0.5" stroke-dasharray="1.5 1.5"/>
    </svg>

    <button class="pin pin--unlocked" id="pinThapba" data-level="thapba" style="left:22%; top:45%;" data-icon="🏛️" data-name="Tháp Bà" data-status="Đã mở khóa — sẵn sàng khám phá">
      <span class="pin-icon">🏛️<span class="pin-order">1</span></span>
      <span class="pin-label">Tháp Bà</span>
    </button>

    <button class="pin pin--locked" id="pinNhathoda" data-level="nhathoda" style="left:52%; top:33%;" data-icon="⛪" data-name="Nhà Thờ Đá" data-status="🔒 Hoàn thành Tháp Bà để mở khóa">
      <span class="pin-icon">⛪<span class="pin-order">2</span></span>
      <span class="pin-label">Nhà Thờ Đá</span>
    </button>

    <button class="pin pin--locked" id="pinHonchong" data-level="honchong" style="left:80%; top:72%;" data-icon="🪨" data-name="Hòn Chồng" data-status="🔒 Hoàn thành Nhà Thờ Đá để mở khóa">
      <span class="pin-icon">🪨<span class="pin-order">3</span></span>
      <span class="pin-label">Hòn Chồng</span>
    </button>

    <div class="tooltip" id="tooltip"></div>

    <div class="hud-scrim"></div>
    <div class="hud-bar">
      <button class="hud-btn" id="museumBtn" title="Bảo tàng Pixel">🏺</button>
      <button class="start-btn" id="startBtn">🎮 BẮT ĐẦU HÀNH TRÌNH</button>
      <button class="hud-btn" id="soundBtn" title="Âm thanh">🔊</button>
      <button class="hud-btn" id="settingsBtn" title="Cài đặt">⚙️</button>
    </div>

    <div class="modal-backdrop" id="museumModal">
      <div class="modal">
        <h3>🏺 BẢO TÀNG PIXEL</h3>
        <div class="museum-slots">
          <div class="slot">🏛️</div>
          <div class="slot">⛪</div>
          <div class="slot">🪨</div>
        </div>
        <p>Mỗi di tích sẽ mở khóa một trang trong bảo tàng khi bạn hoàn thành hành trình khám phá.</p>
        <button class="modal-close" id="closeMuseum">Đóng</button>
      </div>
    </div>
  </div>
</div>
</div><!-- /screenMenu -->

<div class="screen screen--character" id="screenCharacter">
  <div class="char-room">
    <div class="char-wall-glow"></div>
    <div class="char-floor"></div>
    <div class="torch torch--left">🔥</div>
    <div class="torch torch--right">🔥</div>
    <button class="back-btn" id="backToMenu">← Quay lại bản đồ</button>

    <h2 class="char-title">CHỌN NHÂN VẬT</h2>

    <div class="char-row" id="charRow">
      <button class="char-card" data-char="nam" id="cardNam" type="button">
        <span class="char-check">✓</span>
        <svg class="char-sprite" viewBox="0 0 40 58" shape-rendering="crispEdges">
          <rect x="27" y="19" width="9" height="15" fill="#6b4a2b"/>
          <rect x="5" y="25" width="6" height="15" fill="#e8b385"/>
          <rect x="29" y="25" width="6" height="15" fill="#e8b385"/>
          <rect x="12" y="44" width="7" height="12" fill="#22314f"/>
          <rect x="21" y="44" width="7" height="12" fill="#22314f"/>

  const LEVEL_ORDER = ['thapba','nhathoda','honchong'];
  const progress = {
    thapba:{ unlocked:true, completed:false },
    nhathoda:{ unlocked:false, completed:false },
    honchong:{ unlocked:false, completed:false }
  };
  function getLevel(key){ return LEVELS.find(l=>l.key===key); }
  function nextIncompleteLevel(){
    for(const key of LEVEL_ORDER){ if(!progress[key].completed) return key; }
    return null;
  }

  function renderMapState(){
    LEVEL_ORDER.forEach(key=>{
      const pinId = 'pin' + key.charAt(0).toUpperCase() + key.slice(1);
      const pin = document.getElementById(pinId);
      if(!pin) return;
      pin.classList.remove('pin--locked','pin--unlocked');
      const st = progress[key];
      if(st.completed){
        pin.classList.add('pin--unlocked');
        pin.dataset.status = '✅ Đã hoàn thành — có thể chơi lại';
      } else if(st.unlocked){
        pin.classList.add('pin--unlocked');
        pin.dataset.status = 'Đã mở khóa — sẵn sàng khám phá';
      } else {
        pin.classList.add('pin--locked');
        const idx = LEVEL_ORDER.indexOf(key);
        const prevName = idx > 0 ? getLevel(LEVEL_ORDER[idx-1]).name : '';
        pin.dataset.status = '🔒 Hoàn thành ' + prevName + ' để mở khóa';
      }
    });
    const line1 = document.getElementById('pathLine1');
    const line2 = document.getElementById('pathLine2');
    if(progress.nhathoda.unlocked){ line1.setAttribute('stroke','#f4b942cc'); line1.removeAttribute('stroke-dasharray'); }
    if(progress.honchong.unlocked){ line2.setAttribute('stroke','#f4b942cc'); line2.removeAttribute('stroke-dasharray'); }
  }

  // ---------- MAP / PIN INTERACTION ----------
  const pins = document.querySelectorAll('.pin');
  const tooltip = document.getElementById('tooltip');
  const stage = document.getElementById('stage');

  function showTooltip(pin){
    const rect = pin.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    const x = rect.left - stageRect.left + rect.width/2;
    const y = rect.top - stageRect.top;
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
    tooltip.innerHTML = '<b>' + pin.dataset.icon + ' ' + pin.dataset.name + '</b>' + pin.dataset.status;
    tooltip.classList.add('show');
  }
  function hideTooltip(){ tooltip.classList.remove('show'); }

  pins.forEach(pin=>{
    pin.addEventListener('click', e=>{
      e.stopPropagation();
      const key = pin.dataset.level;
      if(progress[key] && progress[key].unlocked){
        hideTooltip();
        enterLevel(key);
      } else {
        showTooltip(pin);
      }
    });
    pin.addEventListener('mouseenter', ()=>showTooltip(pin));
    pin.addEventListener('mouseleave', hideTooltip);
  });
  document.addEventListener('click', hideTooltip);

  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
  }

  const screenMenu = document.getElementById('screenMenu');
  const screenCharacter = document.getElementById('screenCharacter');
  const screenLevel = document.getElementById('screenLevel');
  const screenSummary = document.getElementById('screenSummary');
  function switchScreen(name){
    screenMenu.classList.toggle('active', name === 'menu');
    screenCharacter.classList.toggle('active', name === 'character');
    screenLevel.classList.toggle('active', name === 'level');
    screenSummary.classList.toggle('active', name === 'summary');
  }

  document.getElementById('startBtn').addEventListener('click', ()=>{
    switchScreen('character');
  });
  document.getElementById('backToMenu').addEventListener('click', ()=>{
    switchScreen('menu');
  });

  let selectedChar = null;
  const charRow = document.getElementById('charRow');
  const confirmBtn = document.getElementById('confirmChar');
  document.querySelectorAll('.char-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      document.querySelectorAll('.char-card').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
      charRow.classList.add('has-selection');
      selectedChar = card.dataset.char;
      confirmBtn.disabled = false;
    });
  });

  confirmBtn.addEventListener('click', ()=>{
    if(!selectedChar) return;
    const label = selectedChar === 'nam' ? 'Nhà thám hiểm Nam' : 'Nhà thám hiểm Nữ';
    toast(label + ' sẵn sàng lên đường!');
    const key = nextIncompleteLevel();
    setTimeout(()=>{
      if(key){ enterLevel(key); } else { switchScreen('menu'); }
    }, 1100);
  });

  const soundBtn = document.getElementById('soundBtn');
  let muted = false;
  soundBtn.addEventListener('click', ()=>{
    muted = !muted;
    soundBtn.textContent = muted ? '🔇' : '🔊';
  });

  document.getElementById('settingsBtn').addEventListener('click', ()=>{
    toast('⚙️ Cài đặt — sắp ra mắt');
  });

  const museumModal = document.getElementById('museumModal');
  document.getElementById('museumBtn').addEventListener('click', ()=> museumModal.classList.add('show'));
  document.getElementById('closeMuseum').addEventListener('click', ()=> museumModal.classList.remove('show'));
  museumModal.addEventListener('click', e=>{ if(e.target === museumModal) museumModal.classList.remove('show'); });

  function spawnSparkle(){
    const s = document.createElement('div');
    s.className = 'sparkle';
    const jitterX = (Math.random()-0.5)*6;
    s.style.left = (22 + jitterX) + '%';
    s.style.top = (42 + Math.random()*2) + '%';
    stage.appendChild(s);
    setTimeout(()=> s.remove(), 2600);
  }
  setInterval(spawnSparkle, 700);

  // ---------- LEVEL ENGINE ----------
  let session = null;
  const levelStage = document.getElementById('levelStage');
  const levelName = document.getElementById('levelName');
  const levelPath = document.getElementById('levelPath');
  const hintBtn = document.getElementById('hintBtn');
  const zoneIntro = document.getElementById('zoneIntro');
  const zoneTitle = document.getElementById('zoneTitle');
  const zoneText = document.getElementById('zoneText');
  const questionCard = document.getElementById('questionCard');
  const qProgress = document.getElementById('qProgress');
  const qPrompt = document.getElementById('qPrompt');
  const qOptions = document.getElementById('qOptions');
  const qFeedback = document.getElementById('qFeedback');
  const qNextBtn = document.getElementById('qNextBtn');

  function enterLevel(key){
    const level = getLevel(key);
    if(!level) return;
    session = { levelKey:key, qIndex:0, correctFirstTry:0, hintsLeft:3, hintUsedThisQ:false, answeredCorrectly:false, firstAttempt:true, fragments:[] };
    levelStage.className = 'level-stage ' + level.themeClass;
    levelName.textContent = level.icon + ' ' + level.name;
    hintBtn.disabled = false;
    hintBtn.textContent = '💡 x3';
    document.getElementById('levelHearts').textContent = '❤️❤️❤️';
    buildPathNodes(level);
    switchScreen('level');
    showZoneIntro();
  }

  function buildPathNodes(level){
    levelPath.innerHTML = '';
    level.zones.forEach((z,i)=>{
      const node = document.createElement('div');
      node.className = 'path-node';
      node.id = 'pathNode' + i;
      node.textContent = (i+1);
      const walker = document.createElement('span');
      walker.className = 'walker';
      walker.textContent = selectedChar === 'nu' ? '🙋‍♀️' : '🙋';
      node.appendChild(walker);
      levelPath.appendChild(node);
    });
    updatePathNodes();
  }

  function updatePathNodes(){
    const level = getLevel(session.levelKey);
    level.zones.forEach((z,i)=>{
      const node = document.getElementById('pathNode' + i);
      node.classList.remove('done','current');
      if(i < session.qIndex) node.classList.add('done');
      else if(i === session.qIndex) node.classList.add('current');
    });
  }

  function showZoneIntro(){
    const level = getLevel(session.levelKey);
    const zone = level.zones[session.qIndex];
    zoneTitle.textContent = '📍 ' + zone.label;
    zoneText.textContent = zone.text;
    zoneIntro.style.display = 'block';
    questionCard.style.display = 'none';
    updatePathNodes();
  }

  document.getElementById('zoneContinueBtn').addEventListener('click', showQuestion);

  function showQuestion(){
    const level = getLevel(session.levelKey);
    const q = level.questions[session.qIndex];
    zoneIntro.style.display = 'none';
    questionCard.style.display = 'block';
    qProgress.textContent = 'Câu ' + (session.qIndex+1) + ' / ' + level.questions.length;
    qPrompt.textContent = q.prompt;
    qFeedback.textContent = '';
    qNextBtn.classList.remove('show');
    session.hintUsedThisQ = false;
    session.answeredCorrectly = false;
    session.firstAttempt = true;

    qOptions.innerHTML = '';
    q.options.forEach((opt,i)=>{
      const btn = document.createElement('button');
      btn.className = 'q-option';
      btn.textContent = opt;
      btn.addEventListener('click', ()=> selectAnswer(i, btn));
      qOptions.appendChild(btn);
    });
  }

  function selectAnswer(i, btn){
    const level = getLevel(session.levelKey);
    const q = level.questions[session.qIndex];
    if(session.answeredCorrectly) return;
    if(i === q.correct){
      btn.classList.add('correct');
      session.answeredCorrectly = true;
      if(session.firstAttempt) session.correctFirstTry++;
      qFeedback.textContent = q.effect;
      Array.from(qOptions.children).forEach(b=> b.disabled = true);
      qNextBtn.classList.add('show');
      if(q.fragment) session.fragments.push(q.fragment);
    } else {
      session.firstAttempt = false;
      btn.classList.add('wrong');
      btn.disabled = true;
      qFeedback.textContent = 'Chưa đúng, thử lại nhé!';
    }
  }

  qNextBtn.addEventListener('click', ()=>{
    const level = getLevel(session.levelKey);
    const q = level.questions[session.qIndex];
    const frag = q.fragment;
    const advance = ()=>{
      session.qIndex++;
      if(session.qIndex >= level.questions.length){
        completeLevel();
      } else {
        showZoneIntro();
      }
    };
    if(frag){ showFragment(frag, advance); } else { advance(); }
  });

  function showFragment(frag, onClose){
    document.getElementById('fragmentIcon').textContent = frag.icon;
    document.getElementById('fragmentText').textContent = frag.name + ' — ' + frag.text;
    const modal = document.getElementById('fragmentModal');
    modal.classList.add('show');
    const closeBtn = document.getElementById('fragmentCloseBtn');
    const handler = ()=>{
      modal.classList.remove('show');
      closeBtn.removeEventListener('click', handler);
      onClose();
    };
    closeBtn.addEventListener('click', handler);
  }

  hintBtn.addEventListener('click', ()=>{
    if(!session || session.hintsLeft <= 0 || session.hintUsedThisQ || session.answeredCorrectly) return;
    const level = getLevel(session.levelKey);
    const q = level.questions[session.qIndex];
    const wrongIndices = q.options.map((_,i)=>i).filter(i=> i!==q.correct);
    const toEliminate = wrongIndices.sort(()=>Math.random()-0.5).slice(0,2);
    Array.from(qOptions.children).forEach((btn,i)=>{
      if(toEliminate.includes(i)){ btn.classList.add('eliminated'); btn.disabled = true; }
    });
    session.hintsLeft--;
    session.hintUsedThisQ = true;
    hintBtn.textContent = '💡 x' + session.hintsLeft;
    if(session.hintsLeft <= 0) hintBtn.disabled = true;
  });

  function completeLevel(){
    progress[session.levelKey].completed = true;
    const idx = LEVEL_ORDER.indexOf(session.levelKey);
    if(idx >= 0 && idx+1 < LEVEL_ORDER.length){
      progress[LEVEL_ORDER[idx+1]].unlocked = true;
    }
    renderMapState();
    showSummary();
  }

  function showSummary(){
    const level = getLevel(session.levelKey);
    document.getElementById('summaryTitle').textContent = level.icon + ' ' + level.name.toUpperCase() + ' — HOÀN TẤT';
    const total = level.questions.length;
    const fragTotal = level.questions.filter(q=>q.fragment).length;
    const stats = document.getElementById('summaryStats');
    stats.innerHTML =
      '<div class="row"><span>Câu trả lời đúng (lần đầu)</span><span>' + session.correctFirstTry + '/' + total + '</span></div>' +
      (fragTotal ? '<div class="row"><span>Mảnh ký ức</span><span>' + session.fragments.length + '/' + fragTotal + '</span></div>' : '') +
      '<div class="row"><span>Sinh mạng còn lại</span><span>❤️❤️❤️</span></div>';
    const ratio = session.correctFirstTry / total;
    const stars = ratio >= 0.8 ? '⭐⭐⭐' : ratio >= 0.5 ? '⭐⭐' : '⭐';
    document.getElementById('summaryStars').textContent = stars;
    const idx = LEVEL_ORDER.indexOf(session.levelKey);
    const isLast = idx === LEVEL_ORDER.length - 1;
    document.getElementById('summaryLine').textContent = isLast
      ? 'Bạn đã hoàn thành cả ba hành trình — Nha Trang Pixel Quest xin chúc mừng nhà thám hiểm!'
      : 'Bạn đã trở thành một nhà thám hiểm di sản! Địa điểm tiếp theo trên bản đồ đã được mở khóa.';
    switchScreen('summary');
  }

  document.getElementById('summaryContinueBtn').addEventListener('click', ()=> switchScreen('menu'));
  document.getElementById('levelBackBtn').addEventListener('click', ()=> switchScreen('menu'));

  renderMapState();
</script>
</body>
</html>
